<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>East Africa Hazards Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, Arial, sans-serif; }
    #map { height: 100%; width: 100%; }
    .title-card {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: #fff; padding: 10px 14px; border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.3); max-width: 260px;
    }
    .title-card h1 { font-size: 16px; margin: 0 0 4px; }
    .title-card p { font-size: 12px; margin: 0; color: #555; }
    .legend {
      background: #fff; padding: 8px 10px; border-radius: 6px;
      box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px; line-height: 20px;
    }
    .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; }
    .popup b { font-size: 14px; }
  </style>
</head>
<body>
  <div class="title-card">
    <h1>East Africa Hazards Map</h1>
    <p>Sample drought, flood and displacement hotspots across the IGAD region. Learning project &mdash; illustrative data only.</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Base map centred on the Horn of Africa / IGAD region
    const map = L.map('map').setView([6.5, 39.0], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Colour per hazard type
    const colours = { drought: '#d97706', flood: '#2563eb', displacement: '#9333ea' };
    const radiusFor = p => Math.max(6, Math.sqrt(p.people_affected) / 60);

    // Separate layer groups so each hazard can be toggled on/off
    const groups = {
      Drought: L.layerGroup(),
      Flood: L.layerGroup(),
      Displacement: L.layerGroup()
    };
    const groupKey = { drought: 'Drought', flood: 'Flood', displacement: 'Displacement' };

    fetch('hazards.geojson')
      .then(r => r.json())
      .then(data => {
        data.features.forEach(f => {
          const p = f.properties;
          const [lng, lat] = f.geometry.coordinates;
          const marker = L.circleMarker([lat, lng], {
            radius: radiusFor(p),
            color: colours[p.hazard] || '#555',
            fillColor: colours[p.hazard] || '#555',
            fillOpacity: 0.55,
            weight: 1
          }).bindPopup(
            `<div class="popup"><b>${p.name}, ${p.country}</b><br>` +
            `Hazard: ${p.hazard} (${p.severity})<br>` +
            `People affected: ${p.people_affected.toLocaleString()}</div>`
          );
          marker.addTo(groups[groupKey[p.hazard]]);
        });
        Object.values(groups).forEach(g => g.addTo(map));
        L.control.layers(null, groups, { collapsed: false }).addTo(map);
      })
      .catch(err => {
        console.error('Could not load hazards.geojson', err);
        alert('Could not load hazards.geojson. If opening locally, run a small web server first (see README).');
      });

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML =
        '<strong>Hazard type</strong><br>' +
        '<span class="dot" style="background:#d97706"></span>Drought<br>' +
        '<span class="dot" style="background:#2563eb"></span>Flood<br>' +
        '<span class="dot" style="background:#9333ea"></span>Displacement<br>' +
        '<small>Circle size &asymp; people affected</small>';
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
